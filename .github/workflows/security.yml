name: Security Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  sast_and_sca:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: SCA - Check vulnerable NuGet packages
        run: dotnet list package --vulnerable

      - name: SAST - Semgrep Scan
        uses: returntocorp/semgrep-action@v1
        with:
          config: "src/SAST-Rules/sast-rules.yml p/csharp p/security-audit"
  
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build and Run App and DAST - OWASP ZAP API Scan
        run: |
          dotnet build
          dotnet run --urls "http://0.0.0.0:5000" &
          sleep 10 
          docker run --rm -v "${PWD}:/zap/wrk/:rw" -t zaproxy/zap-stable zap-api-scan.py -t "http://host.docker.internal:5176/openapi/v1.json" -f openapi -c "/zap/wrk/ZAP-Rules/zap-rules.conf"

     
